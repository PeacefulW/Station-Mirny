<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Station Mirny Terrain 3D Prototype</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #151514;
      color: #ddd6c8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .panel {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      padding: 10px;
      background: rgba(22, 21, 19, 0.78);
      border: 1px solid rgba(216, 199, 164, 0.32);
      border-radius: 6px;
      backdrop-filter: blur(8px);
    }

    button {
      min-width: 36px;
      height: 34px;
      border: 1px solid rgba(216, 199, 164, 0.36);
      border-radius: 4px;
      background: #27231f;
      color: #ddd6c8;
      font: inherit;
      cursor: pointer;
    }

    button.active {
      border-color: #d4a15f;
      background: #3c3023;
      color: #ffdca3;
    }

    .divider {
      width: 1px;
      height: 30px;
      background: rgba(216, 199, 164, 0.25);
    }

    .status {
      min-width: 64px;
      color: #bfae92;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="panel" aria-label="Terrain prototype controls">
      <button data-map="blob" class="active" title="Blob shape">Blob</button>
      <button data-map="diagonal" title="Diagonal islands">Diag</button>
      <button data-map="rooms" title="Room-like plateaus">Rooms</button>
      <button data-map="ridge" title="Long ridge">Ridge</button>
      <span class="divider" aria-hidden="true"></span>
      <button id="toggle-mode" title="Enter or leave mountain base">Enter</button>
      <span id="mode-status" class="status">Outside</span>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.165.0/build/three.module.js";

    const app = document.querySelector("#app");
    const maps = {
      blob: [
        "00000000",
        "00110000",
        "01111000",
        "01111000",
        "00010000",
        "00000000"
      ],
      diagonal: [
        "00000000",
        "00100000",
        "00010000",
        "00001000",
        "00000000",
        "00000000"
      ],
      rooms: [
        "0000000000",
        "0011100000",
        "0011101100",
        "0011101100",
        "0000001100",
        "0000000000"
      ],
      ridge: [
        "0000000000",
        "0011111000",
        "0011111100",
        "0001111100",
        "0000011000",
        "0000000000"
      ]
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x151514);

    const camera = new THREE.OrthographicCamera(-6, 6, 4, -4, 0.1, 100);
    camera.position.set(5.8, 5.2, 7.5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    app.appendChild(renderer.domElement);

    const ambient = new THREE.HemisphereLight(0xe7d8bb, 0x171819, 1.45);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffe3b0, 2.35);
    sun.position.set(-3.5, 7, 4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(32, 24),
      new THREE.MeshStandardMaterial({ color: 0x24211d, roughness: 0.92, metalness: 0.0 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.03;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(24, 24, 0x544636, 0x342d25);
    grid.position.y = -0.025;
    scene.add(grid);

    let terrain = null;
    let interiorGroup = null;
    let entranceGroup = null;
    let playerMarker = null;
    let playerLight = null;
    let selected = "blob";
    let inside = false;
    let playerProgress = 0;
    let currentRows = maps[selected];
    let outsidePoint = new THREE.Vector3(0, 0.14, 0);
    let insidePoint = new THREE.Vector3(0, 0.18, 0);
    const modeButton = document.querySelector("#toggle-mode");
    const modeStatus = document.querySelector("#mode-status");

    function roundedBoxSdf(px, pz, cx, cz, hx, hz, radius) {
      const qx = Math.abs(px - cx) - (hx - radius);
      const qz = Math.abs(pz - cz) - (hz - radius);
      const ox = Math.max(qx, 0);
      const oz = Math.max(qz, 0);
      return Math.hypot(ox, oz) + Math.min(Math.max(qx, qz), 0) - radius;
    }

    function smoothUnion(a, b, k) {
      const h = Math.max(0, Math.min(1, 0.5 + 0.5 * (b - a) / k));
      return b * (1 - h) + a * h - k * h * (1 - h);
    }

    function mapCells(rows) {
      const cells = [];
      for (let z = 0; z < rows.length; z += 1) {
        for (let x = 0; x < rows[z].length; x += 1) {
          if (rows[z][x] === "1") cells.push([x, z]);
        }
      }
      return cells;
    }

    function sdfForCells(px, pz, rows) {
      const cells = mapCells(rows);
      let d = 999;
      for (const [x, z] of cells) {
        const cellD = roundedBoxSdf(px, pz, x + 0.5, z + 0.5, 0.55, 0.55, 0.28);
        d = d === 999 ? cellD : smoothUnion(d, cellD, 0.9);
      }
      return d;
    }

    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    function heightAt(px, pz, rows) {
      const d = sdfForCells(px, pz, rows);
      const cliff = smoothstep(0.18, -0.04, d);
      const chip = 0.012 * Math.sin(px * 9.7 + pz * 2.1) * Math.sin(pz * 8.2);
      return Math.max(0, cliff * 1.05 + chip * cliff * (1 - smoothstep(-0.16, -0.36, d)));
    }

    function vertexColor(height, d) {
      const top = new THREE.Color(0xa88958);
      const rim = new THREE.Color(0xd7bd60);
      const wall = new THREE.Color(0x3bb851);
      const groundColor = new THREE.Color(0x24211d);
      if (height < 0.03) return groundColor;
      if (d > -0.04) return wall;
      if (d > -0.18) return rim;
      return top;
    }

    function disposeGroup(group) {
      if (!group) return;
      group.traverse((child) => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          if (Array.isArray(child.material)) {
            child.material.forEach((material) => material.dispose());
          } else {
            child.material.dispose();
          }
        }
      });
      scene.remove(group);
    }

    function createMaterial(color, options = {}) {
      return new THREE.MeshStandardMaterial({
        color,
        roughness: options.roughness ?? 0.82,
        metalness: 0.0,
        transparent: true,
        opacity: options.opacity ?? 1,
        emissive: options.emissive ?? 0x000000,
        emissiveIntensity: options.emissiveIntensity ?? 0
      });
    }

    function createBox(group, x, y, z, sx, sy, sz, material) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
      return mesh;
    }

    function findEntrance(rows) {
      const width = rows[0].length;
      const depth = rows.length;
      const px = width * 0.5;
      let pz = depth * 0.5;
      for (let sample = depth; sample >= 0; sample -= 0.025) {
        if (sdfForCells(px, sample, rows) < 0.04) {
          pz = sample;
          break;
        }
      }
      return {
        px,
        pz,
        x: px - width / 2,
        z: pz - depth / 2,
        y: Math.max(0.22, heightAt(px, pz, rows) * 0.48)
      };
    }

    function buildInterior(rows) {
      disposeGroup(interiorGroup);
      disposeGroup(entranceGroup);
      interiorGroup = new THREE.Group();
      entranceGroup = new THREE.Group();

      const entry = findEntrance(rows);
      outsidePoint.set(entry.x, 0.14, entry.z + 1.25);
      insidePoint.set(0, 0.18, Math.min(entry.z - 0.8, 0.2));

      const floorMaterial = createMaterial(0x5d503f, { roughness: 0.9 });
      const wallMaterial = createMaterial(0x7b674e, { roughness: 0.86 });
      const equipmentMaterial = createMaterial(0x334040, { roughness: 0.72 });
      const warmMaterial = createMaterial(0xffc46f, {
        roughness: 0.45,
        emissive: 0xff9f45,
        emissiveIntensity: 1.7
      });
      const portalDark = createMaterial(0x070706, { roughness: 0.95 });
      const portalRim = createMaterial(0xd0a24f, {
        roughness: 0.7,
        emissive: 0x5f3b15,
        emissiveIntensity: 0.45
      });

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(3.7, 2.45), floorMaterial);
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0, 0.075, -0.1);
      floor.receiveShadow = true;
      interiorGroup.add(floor);

      createBox(interiorGroup, 0, 0.27, -1.35, 3.8, 0.36, 0.16, wallMaterial);
      createBox(interiorGroup, -1.9, 0.27, -0.1, 0.16, 0.36, 2.35, wallMaterial);
      createBox(interiorGroup, 1.9, 0.27, -0.1, 0.16, 0.36, 2.35, wallMaterial);
      createBox(interiorGroup, -0.55, 0.27, 1.08, 1.1, 0.36, 0.16, wallMaterial);
      createBox(interiorGroup, 1.08, 0.27, 1.08, 0.74, 0.36, 0.16, wallMaterial);
      createBox(interiorGroup, -0.15, 0.24, -0.18, 0.14, 0.28, 1.1, wallMaterial);

      createBox(interiorGroup, -1.15, 0.2, -0.45, 0.55, 0.24, 0.45, equipmentMaterial);
      createBox(interiorGroup, 0.95, 0.18, -0.62, 0.66, 0.2, 0.34, equipmentMaterial);
      createBox(interiorGroup, 0.78, 0.17, 0.58, 0.42, 0.18, 0.42, equipmentMaterial);

      for (const [x, z] of [[-1.25, -1.02], [1.25, -1.02], [1.35, 0.72], [-1.35, 0.72]]) {
        const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 10), warmMaterial);
        lamp.position.set(x, 0.34, z);
        interiorGroup.add(lamp);
        const light = new THREE.PointLight(0xffb663, 0.8, 2.8);
        light.position.set(x, 0.44, z);
        interiorGroup.add(light);
      }

      const ramp = new THREE.Mesh(new THREE.PlaneGeometry(0.88, 1.45), portalDark);
      ramp.rotation.x = -Math.PI / 2;
      ramp.position.set(entry.x, 0.012, entry.z + 0.72);
      ramp.receiveShadow = true;
      entranceGroup.add(ramp);

      createBox(entranceGroup, entry.x, entry.y, entry.z + 0.03, 0.82, 0.72, 0.08, portalDark);
      createBox(entranceGroup, entry.x - 0.48, entry.y, entry.z + 0.06, 0.12, 0.88, 0.12, portalRim);
      createBox(entranceGroup, entry.x + 0.48, entry.y, entry.z + 0.06, 0.12, 0.88, 0.12, portalRim);
      createBox(entranceGroup, entry.x, entry.y + 0.42, entry.z + 0.06, 1.08, 0.12, 0.12, portalRim);

      scene.add(interiorGroup);
      scene.add(entranceGroup);
      applyInteriorVisibility(inside ? 1 : 0);
    }

    function ensurePlayerMarker() {
      if (playerMarker) return;
      const markerMaterial = createMaterial(0xffd48b, {
        roughness: 0.5,
        emissive: 0xd68632,
        emissiveIntensity: 0.9
      });
      playerMarker = new THREE.Mesh(new THREE.SphereGeometry(0.12, 20, 14), markerMaterial);
      playerMarker.castShadow = true;
      scene.add(playerMarker);

      playerLight = new THREE.PointLight(0xffbd72, 0.9, 2.4);
      scene.add(playerLight);
    }

    function setGroupOpacity(group, opacity) {
      if (!group) return;
      group.visible = opacity > 0.02;
      group.traverse((child) => {
        if (child.material) {
          child.material.opacity = opacity;
          child.material.depthWrite = opacity > 0.96;
        }
      });
    }

    function applyInteriorVisibility(opacity) {
      setGroupOpacity(interiorGroup, opacity);
    }

    function updateModeUi() {
      modeButton.textContent = inside ? "Exit" : "Enter";
      modeButton.classList.toggle("active", inside);
      modeStatus.textContent = inside ? "Inside" : "Outside";
    }

    function setInside(value) {
      inside = value;
      updateModeUi();
    }

    function buildTerrain(rows) {
      if (terrain) {
        terrain.geometry.dispose();
        terrain.material.dispose();
        scene.remove(terrain);
      }

      const width = rows[0].length;
      const depth = rows.length;
      const samplesX = width * 18;
      const samplesZ = depth * 18;
      const positions = [];
      const colors = [];
      const indices = [];
      const halfX = width / 2;
      const halfZ = depth / 2;

      for (let z = 0; z <= samplesZ; z += 1) {
        const pz = (z / samplesZ) * depth;
        for (let x = 0; x <= samplesX; x += 1) {
          const px = (x / samplesX) * width;
          const d = sdfForCells(px, pz, rows);
          const y = heightAt(px, pz, rows);
          positions.push(px - halfX, y, pz - halfZ);
          const color = vertexColor(y, d);
          colors.push(color.r, color.g, color.b);
        }
      }

      for (let z = 0; z < samplesZ; z += 1) {
        for (let x = 0; x < samplesX; x += 1) {
          const a = z * (samplesX + 1) + x;
          const b = a + 1;
          const c = a + samplesX + 1;
          const d = c + 1;
          indices.push(a, c, b, b, c, d);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      const material = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.86,
        metalness: 0.0,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: inside ? 0.36 : 1
      });

      terrain = new THREE.Mesh(geometry, material);
      terrain.castShadow = true;
      terrain.receiveShadow = true;
      scene.add(terrain);
      buildInterior(rows);
      ensurePlayerMarker();

    }

    function resize() {
      const w = app.clientWidth;
      const h = app.clientHeight;
      const aspect = w / Math.max(h, 1);
      const view = 6.2;
      camera.left = -view * aspect;
      camera.right = view * aspect;
      camera.top = view;
      camera.bottom = -view;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }

    function setMap(name) {
      selected = name;
      currentRows = maps[name];
      buildTerrain(currentRows);
      document.querySelectorAll("button[data-map]").forEach((button) => {
        button.classList.toggle("active", button.dataset.map === name);
      });
    }

    document.querySelectorAll("button[data-map]").forEach((button) => {
      button.addEventListener("click", () => setMap(button.dataset.map));
    });

    modeButton.addEventListener("click", () => setInside(!inside));
    window.addEventListener("keydown", (event) => {
      if (event.key.toLowerCase() === "e") setInside(!inside);
    });

    window.addEventListener("resize", resize);
    resize();
    setMap(selected);
    updateModeUi();

    function animate(time) {
      const orbit = time * 0.00008;
      const radius = 9.6;
      camera.position.x = Math.sin(orbit) * radius;
      camera.position.z = Math.cos(orbit) * radius;
      camera.position.y = 5.3;
      camera.lookAt(0, 0.2, 0);
      const targetTerrainOpacity = inside ? 0.34 : 1;
      if (terrain?.material) {
        terrain.material.opacity = THREE.MathUtils.lerp(terrain.material.opacity, targetTerrainOpacity, 0.065);
        terrain.material.depthWrite = terrain.material.opacity > 0.96;
      }

      playerProgress = THREE.MathUtils.lerp(playerProgress, inside ? 1 : 0, 0.055);
      const interiorOpacity = smoothstep(0.08, 0.62, playerProgress);
      applyInteriorVisibility(interiorOpacity);
      if (playerMarker) {
        playerMarker.position.lerpVectors(outsidePoint, insidePoint, playerProgress);
        playerMarker.position.y += Math.sin(time * 0.006) * 0.025;
        playerLight.position.copy(playerMarker.position).add(new THREE.Vector3(0, 0.35, 0));
        playerLight.intensity = 0.55 + interiorOpacity * 0.75;
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
